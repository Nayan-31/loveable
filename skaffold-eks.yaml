apiVersion: skaffold/v4beta13
kind: Config

build:
  tagPolicy:
    sha256: {}

  platforms:
    - linux/amd64        # EKS t3.medium nodes are x86_64 — Mac M1/M2/M3 must cross-build , hamari AWS pe jitni bhi machines hai wo by default rehega amd-64 but mac pe arm based rehta hai 

  artifacts:
 #ye kya kar raha hai na ki ye particular skaffold file pehle image banayega yaha pe jitni saari di gyi hai thik and usko ECR pe push kar dega 
    - image: 525390917683.dkr.ecr.ap-south-1.amazonaws.com/ai-service
      context: ai-service
      docker:
        dockerfile: dockerfile

    - image: 525390917683.dkr.ecr.ap-south-1.amazonaws.com/auth-service
      context: auth-service
      docker:
        dockerfile: Dockerfile

    - image: 525390917683.dkr.ecr.ap-south-1.amazonaws.com/project-service
      context: project-service
      docker:
        dockerfile: dockerfile

    - image: 525390917683.dkr.ecr.ap-south-1.amazonaws.com/express-file-server
      context: express-file-server
      docker:
        dockerfile: dockerfile

    - image: 525390917683.dkr.ecr.ap-south-1.amazonaws.com/nextjs-boilerplate
      context: nextboilerplate
      docker:
        dockerfile: dockerfile

    - image: 525390917683.dkr.ecr.ap-south-1.amazonaws.com/sync-service
      context: sync-service
      docker:
        dockerfile: Dockerfile

manifests:
  rawYaml:
    - k8s/ai-deployment.yml #itna hi nahi ye skaffold ki command in sabhi ko ECR pe push karne ke baad EKS pe deploy kar dega waha run kar dega 
    - k8s/ai-service.yml
    - k8s/auth-deployment.yml
    - k8s/auth-service.yml
    - k8s/project-deployment.yml
    - k8s/project-service.yml
    - k8s/ingress.yml
    - k8s/rbac.yml
    - k8s/secrets.yml